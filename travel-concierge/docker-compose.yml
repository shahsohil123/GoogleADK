name: travel-concierge-a2a

x-common-env: &common-env
  GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-your-gcp-project-id}
  GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
  VERTEX_ENGINE_LOCATION: ${VERTEX_ENGINE_LOCATION:-us-central1}
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  GENAI_MODEL: ${GENAI_MODEL:-gemini-3-flash-preview}
  # Local Docker mode runs statelessly (InMemorySessionService & SharedInMemoryMemoryService)
  # and only connects to GCP for the Gemini LLM model call:
  LOCAL_MODE: ${LOCAL_MODE:-true}
  AGENT_REGISTRY_BASE_URL: ${AGENT_REGISTRY_BASE_URL:-http://local_agent_registry:8000/v1}
  DOCKER_NETWORK_MODE: "true"
  OTEL_TO_CLOUD: ${OTEL_TO_CLOUD:-false}
  BQ_ANALYTICS_ENABLED: ${BQ_ANALYTICS_ENABLED:-false}
  GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json

services:
  local_agent_registry:
    image: travel-concierge-local:latest
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: tc-local-agent-registry
    working_dir: /workspace
    command: ["uvicorn", "local_agent_registry:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-your-gcp-project-id}
      AGENT_REGISTRY_LOCATION: "global"
      DOCKER_NETWORK_MODE: "true"
    volumes:
      - ./local_agent_registry.py:/workspace/local_agent_registry.py:ro

  root_agent:
    image: travel-concierge-local:latest
    container_name: tc-root-agent
    working_dir: /workspace
    command: ["uvicorn", "root_concierge_agent.a2a_app:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["8001:8001"]
    depends_on: [local_agent_registry]
    environment:
      <<: *common-env
      PORT: "8001"
      OTEL_SERVICE_NAME: root_agent
    volumes:
      - ./root_agent:/workspace:ro
      - ~/.config/gcloud:/root/.config/gcloud:ro

  inspiration_agent:
